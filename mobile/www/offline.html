<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trefort</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #00788D; color: #fff; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 32px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; background: #fff; padding: 8px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 8px 0 0; }
  p { margin: 0; max-width: 320px; line-height: 1.5; opacity: .9; }
  button { margin-top: 12px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #FFA500; color: #17212b; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>No connection</h1>
  <p>Trefort needs a signal the first time it opens. Once you've opened a page online, it's saved for jobsites without service.</p>
  <button type="button" onclick="location.replace('https://app.trefortpro.com/')">Try again</button>
</main>
</body>
</html>
